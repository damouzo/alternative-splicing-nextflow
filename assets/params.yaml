# Template params file. Copy and edit paths for your project.

# Input contracts
input: assets/samplesheet.csv
comparisons: assets/comparisons.csv
outdir: ./results

# References
# Must match the references used during alignment/quantification.
gtf: /path/to/reference/annotation.gtf

# Option A (recommended): build transcript FASTA from genome + GTF
use_gffread: true
genome_fasta: /path/to/reference/genome.fa
transcript_fasta: null

# Option B: provide transcript FASTA directly
# use_gffread: false
# transcript_fasta: /path/to/reference/transcripts.fa

genome_build: hg38

# Library settings
strandedness: reverse
read_length: 150

# Tool toggles
# Core tools (enabled by default in nextflow.config):
run_rmats: true
run_majiq: true
run_isar: true

# Optional tools (DISABLED by default in nextflow.config).
# Set any of these to true to enable the corresponding analysis.
# - run_leafcutter : intron-excision differential splicing (LeafCutter)
# - run_sashimi    : Sashimi plots for the top rMATS events (requires run_rmats: true)
# - run_pegasas    : pathway activity x PSI correlation (requires run_rmats: true
#                    and --salmon_merged_tpm pointing to the nf-core/rnaseq gene TPM file)
# - run_de_as      : DE + AS dual-hit integration in the report (requires --dge_dirs)
run_leafcutter: false
run_sashimi:    false
run_pegasas:    false
run_de_as:      false

# Optional inputs required by the optional tools.
# Only needed when the matching toggle above is set to true:

# PEGASAS — merged gene-level TPM table from nf-core/rnaseq
# (results/star_salmon/salmon.merged.gene_tpm.tsv)
salmon_merged_tpm: /path/to/nfcore_rnaseq/results/star_salmon/salmon.merged.gene_tpm.tsv

# DE + AS integration — one or more directories of DESeq2 results (one subdir per
# DGE comparison, each containing a *_DESeq2_results.csv), e.g. from bulkAnnex.
# Each contrast is matched to its DGE subdir by name; add de_results_map entries
# for names that do not follow the reverse group pattern.
dge_dirs:
  - /path/to/bulk/de/results/dge
  - /path/to/bulk/de/results_SF3B1/dge

# MAJIQ license key path.
# If MAJIQ_LICENSE_FILE is exported in your environment,
# this can be omitted or left as null.
majiq_license: /path/to/licenses/majiq_license.key

# Path to the MAJIQ Apptainer .sif image.
# Build it with: apptainer build --fakeroot /path/to/majiq.sif <repo>/containers/majiq/Dockerfile
# If MAJIQ_SIF is exported in your environment, this can be omitted.
majiq_sif: /path/to/majiq.sif
