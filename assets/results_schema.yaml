# Results contract for the shippable deliverables layer.
#
# Single source of truth for the layout and columns produced by the pipeline.
# validate_results_contract.py and docs/output.md mirror this file; bump
# schema_version when a path or a column changes.
#
# results/ contains two siblings:
#   deliverables/  everything the recipient gets (shipping = rename + zip)
#   raw/           native per-tool output, audit-only, never shipped
# All paths *inside* deliverables/ (sashimi_index.tsv, manifests) are relative
# to the deliverables/ root, so the folder survives renaming/moving.
schema_version: 2.1.0

shippable_root: deliverables/

# What the recipient gets when the deliverables/ folder is zipped.
shippable:
  - deliverables/README.md
  - deliverables/run_info/run_manifest.yaml
  - deliverables/run_info/sample_index.tsv
  - deliverables/run_info/software_versions.yml
  - deliverables/run_info/qa_report.txt
  - deliverables/contrasts/<comparison_id>/<comparison_id>_splicing_report.html
  - deliverables/contrasts/<comparison_id>/contrast_manifest.yaml
  - deliverables/contrasts/<comparison_id>/tables/<comparison_id>.<tool>.master.tsv
  - deliverables/contrasts/<comparison_id>/tables/<comparison_id>.<tool>.significant.tsv
  - deliverables/contrasts/<comparison_id>/tables/<comparison_id>.<tool>.summary.tsv
  - deliverables/contrasts/<comparison_id>/tables/<comparison_id>.cross_tool.master.tsv
  - deliverables/contrasts/<comparison_id>/tables/<comparison_id>.cross_tool.gene_summary.tsv
  - deliverables/contrasts/<comparison_id>/plots/sashimi/sashimi_index.tsv
  - deliverables/contrasts/<comparison_id>/plots/sashimi/<EVENT_TYPE>/<plot>.pdf
  - deliverables/cross_contrast/pegasas/

# Audit evidence. Not part of the shipment.
audit_only:
  - deliverables/run_info/pipeline_info/
  - raw/

# Tools that produce a per-contrast master/significant/summary table.
tools:
  - rmats
  - majiq
  - isar
  - leafcutter
  - pegasas

# Columns every <tool>.master.tsv must carry (native columns are appended).
master_columns:
  - comparison_id
  - tool
  - feature_type
  - feature_id
  - gene_id
  - gene_symbol
  - effect_size
  - effect_size_type
  - pvalue
  - padj
  - padj_method
  - is_significant
  - significance_rule
  - source_file

# Columns required by the validator when checking a master.
required_master_columns:
  - comparison_id
  - tool
  - feature_type
  - feature_id
  - gene_id
  - gene_symbol
  - effect_size
  - effect_size_type
  - is_significant
  - significance_rule
  - source_file

sample_index_columns:
  - sample_id
  - condition
  - replicate
  - comparison_id
  - group

sashimi_index_columns:
  - comparison_id
  - event_type
  - rank
  - gene_symbol
  - site_class
  - plot_id
  - pdf_path

cross_tool_gene_columns:
  - comparison_id
  - gene_symbol
  - gene_id
  - n_tools_significant
  - tools
  - best_effect_size
  - best_padj

# Paths that must stay relative (never absolute, never pointing at raw/) inside
# the shippable layer.
relative_paths:
  - deliverables/contrasts/<comparison_id>/plots/sashimi/sashimi_index.tsv: pdf_path
  - deliverables/contrasts/<comparison_id>/contrast_manifest.yaml: all entries

# padj_method vocabulary.
padj_methods:
  - BH
  - rmats_cstat
  - satuRn_empirical
  - none

# rMATS location columns (contract 2.1.0, additive; validated non-empty):
#   event_locus   chr:start-end (1-based inclusive) spanning every coordinate of
#                 the event; paste-ready for IGV.
#   event_coords  native rMATS coordinates, 0-based as in *.MATS.JC.txt, named
#                 per event type: SE exon/upstream/downstream; A5SS,A3SS
#                 long/short/flanking; MXE 1stExon/2ndExon/upstream/downstream;
#                 RI riExon/upstream/downstream.
rmats_location_columns:
  - event_locus
  - event_coords

# Legacy columns following the SE event shape. Only SE rows are populated;
# non-SE event types leave them empty. Superseded by event_locus/event_coords;
# scheduled for removal in 3.0.0.
rmats_legacy_coordinate_columns:
  - exon_start_0base
  - exon_end
  - upstream_es
  - upstream_ee
  - downstream_es
  - downstream_ee
